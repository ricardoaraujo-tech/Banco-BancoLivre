<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente - Banco Livre</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Banco Livre</h1>
        <p class="subtitle">Adicionar Novo Cliente</p>

        <div class="card">
            <h2>Formulário de Registo</h2>
            
            <!-- Mostra mensagens de erro (ex: CPF inválido) -->
            {% if erro %}
                <div style="background-color: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                    <strong>Erro:</strong> {{ erro }}
                </div>
            {% endif %}

            <form action="{{ url_for('cadastrar_cliente') }}" method="POST">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Apenas números ou formato 000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" placeholder="Digite o telefone" required>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Morada do cliente" required>
                </div>

                <button type="submit" class="btn-primary">Salvar Cliente</button>
                <a href="{{ url_for('index') }}" style="margin-left: 10px; text-decoration: none; color: #666;">Cancelar e Voltar</a>
            </form>
        </div>
    </div>

</body>
</html>
