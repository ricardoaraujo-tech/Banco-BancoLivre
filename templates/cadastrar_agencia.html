<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Agência - Banco Livre</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Banco Livre</h1>
        <p class="subtitle">Adicionar Nova Agência</p>

        <div class="card">
            <h2>Formulário de Registo de Agência</h2>
            
            {% if erro %}
                <div style="background-color: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                    <strong>Erro:</strong> {{ erro }}
                </div>
            {% endif %}

            <form action="{{ url_for('cadastrar_agencia') }}" method="POST">
                <div class="form-group">
                    <label for="numero">Número da Agência:</label>
                    <input type="text" id="numero" name="numero" placeholder="Ex: 100" required>
                </div>

                <div class="form-group">
                    <label for="nome">Nome da Agência:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Agência Central" required>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Morada da agência" required>
                </div>

                <button type="submit" class="btn-primary">Salvar Agência</button>
                <a href="{{ url_for('index') }}" style="margin-left: 10px; text-decoration: none; color: #666;">Cancelar e Voltar</a>
            </form>
        </div>
    </div>

</body>
</html>
